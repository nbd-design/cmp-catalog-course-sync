name: Daily Course Sync

on:
  # Run Monday, Wednesday, Friday at 2 AM UTC
  schedule:
    - cron: '0 2 * * 1,3,5'
  
  # Allow manual triggering from Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run sync script
        id: sync
        continue-on-error: true
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: |
          npm run sync:two-step 2>&1 | tee sync-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Extract sync summary
        id: summary
        if: always()
        run: |
          if [ -f sync-output.log ]; then
            # Extract key metrics from the two-step sync log
            ROWS_DELETED=$(grep -oP "(?<=Rows Deleted: )\d+" sync-output.log | tail -1 || echo "N/A")
            API_COURSES=$(grep -oP "(?<=API Courses: )\d+" sync-output.log | tail -1 || echo "N/A")
            ROWS_CREATED=$(grep -oP "(?<=Rows Created: )\d+" sync-output.log | tail -1 || echo "N/A")
            ROWS_FAILED=$(grep -oP "(?<=Rows Failed: )\d+" sync-output.log | tail -1 || echo "N/A")
            TABLE_BEFORE=$(grep -oP "(?<=Table Before: )\d+" sync-output.log | tail -1 || echo "N/A")
            TABLE_AFTER=$(grep -oP "(?<=Table After: )\d+" sync-output.log | tail -1 || echo "N/A")
            SUCCESS_RATE=$(grep -oP "(?<=Success Rate: )[0-9.]+%" sync-output.log | tail -1 || echo "N/A")
            DURATION=$(grep -oP "(?<=Total Duration: )[0-9.]+s" sync-output.log | tail -1 || echo "N/A")
            
            echo "rows_deleted=$ROWS_DELETED" >> $GITHUB_OUTPUT
            echo "api_courses=$API_COURSES" >> $GITHUB_OUTPUT
            echo "rows_created=$ROWS_CREATED" >> $GITHUB_OUTPUT
            echo "rows_failed=$ROWS_FAILED" >> $GITHUB_OUTPUT
            echo "table_before=$TABLE_BEFORE" >> $GITHUB_OUTPUT
            echo "table_after=$TABLE_AFTER" >> $GITHUB_OUTPUT
            echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
            echo "duration=$DURATION" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.sync.outputs.exit_code == '0' && '✅ HubSpot Course Sync - Success' || '❌ HubSpot Course Sync - Failed' }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          body: |
            HubSpot Course Sync Report
            ==========================================
            
            Status: ${{ steps.sync.outputs.exit_code == '0' && '✅ SUCCESS' || '❌ FAILED' }}
            Date: ${{ github.event.repository.updated_at }}
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            STEP 1 - CLEANUP:
            - Rows Deleted: ${{ steps.summary.outputs.rows_deleted }}
            
            STEP 2 - SYNC:
            - API Courses: ${{ steps.summary.outputs.api_courses }}
            - Rows Created: ${{ steps.summary.outputs.rows_created }}
            - Rows Failed: ${{ steps.summary.outputs.rows_failed }}
            
            FINAL RESULT:
            - Table Before: ${{ steps.summary.outputs.table_before }} courses
            - Table After: ${{ steps.summary.outputs.table_after }} courses
            - Success Rate: ${{ steps.summary.outputs.success_rate }}
            - Duration: ${{ steps.summary.outputs.duration }}
            
            ==========================================
            
            View detailed logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Create job summary
        if: always()
        run: |
          echo "## 📊 Two-Step Course Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sync.outputs.exit_code }}" == "0" ]; then
            echo "### ✅ Status: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Status: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📋 Step 1: Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rows Deleted | ${{ steps.summary.outputs.rows_deleted }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📥 Step 2: Sync" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Courses | ${{ steps.summary.outputs.api_courses }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rows Created | ${{ steps.summary.outputs.rows_created }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rows Failed | ${{ steps.summary.outputs.rows_failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📈 Final Result" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Table Before | ${{ steps.summary.outputs.table_before }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Table After | ${{ steps.summary.outputs.table_after }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Success Rate | ${{ steps.summary.outputs.success_rate }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${{ steps.summary.outputs.duration }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if sync failed
        if: steps.sync.outputs.exit_code != '0'
        run: exit 1

